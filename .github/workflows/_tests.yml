name: Run tests
on:
  workflow_call

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
      - name: Install pip
        run: python -m ensurepip --upgrade
      - name: Install pip tools
        # pip-tools 7.6.0 crashes on Python 3.10 (imports typing_extensions
        # without declaring it as a dependency); pin to the last good release.
        run: pip install "pip-tools==7.5.3"
      - name: Install compile dependencies
        run: pip-compile --output-file=requirements.txt requirements-base.in requirements-dev.in requirements.in
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run unit tests
        run: pytest
